[project]
name = "open-escl-client"
version = "0.1.0"
description = "Cross-platform eSCL (AirScan) scanner client optimized for Brother scanners on macOS and Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "httpx>=0.27.0",
    "zeroconf>=0.132.0",
    "lxml>=5.2.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "Pillow>=10.3.0",
    "img2pdf>=0.5.1",
]

[project.scripts]
open-escl-client = "open_escl_client.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_escl_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
